# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    target-branch: "develop"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "area:dependencies"
    target-branch: "develop"

  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: weekly
    labels:
      - "area:dependencies"
    target-branch: "develop"
    ignore:
      # Runtime-family changes need a coordinated .NET migration.
      - dependency-name: "Microsoft.AspNetCore.SignalR.Client"
        versions: ["11.*"]
      - dependency-name: "Microsoft.Extensions.Caching.Memory"
        versions: ["11.*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "area:dependencies"
    target-branch: "develop"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "area:dependencies"
    target-branch: "develop"
    ignore:
      # Keep the SDK and runtime aligned with global.json and the app target.
      - dependency-name: "dotnet/sdk"
        versions: ["~> 11.0"]
      - dependency-name: "dotnet/aspnet"
        versions: ["~> 11.0"]
