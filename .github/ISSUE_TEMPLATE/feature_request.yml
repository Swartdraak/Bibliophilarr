name: Feature Request
description: 'Suggest an idea for Bibliophilarr'
labels: ['enhancement']
body:
- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please search to see if an open or closed issue already exists for the feature you are requesting. If a request exists and is closed note that it may only be fixed in an unstable branch.
    options:
    - label: I have searched the existing open and closed issues
      required: true
- type: textarea
  attributes:
    label: Is your feature request related to a problem? Please describe
    description: A clear and concise description of what the problem is.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe the solution you'd like
    description: A clear and concise description of what you want to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe alternatives you've considered
    description: A clear and concise description of any alternative solutions or features you've considered.
  validations:
    required: true
- type: dropdown
  attributes:
    label: Which area would this change affect?
    description: Maintainers will translate this into the durable `area:*` tracking labels.
    options:
      - Metadata/providers
      - API/backend
      - Frontend/UI
      - Import/download/file handling
      - Build/CI/tooling
      - Documentation
      - Release/packaging
      - Unknown / needs maintainer triage
  validations:
    required: true
- type: dropdown
  attributes:
    label: Expected delivery importance
    description: Helps maintainers choose the final priority and risk labels.
    options:
      - Critical / release-blocking follow-up
      - High-value near-term work
      - Normal planned improvement
      - Nice-to-have
  validations:
    required: true
- type: input
  attributes:
    label: Related issue or epic (if known)
    description: 'Example: #96 or #99'
    placeholder: '#123'
  validations:
    required: false
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links? References? Mockups? Anything that will give us more context about the feature you are encountering!
      
      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: true
