# Labeler rules for actions/labeler@v6 (match-object schema).
# Each label maps to an array of condition objects; a PR is labeled when ANY
# condition matches.
# The `changed-files` matcher applies when at least one changed file matches one
# of the listed globs. This is the valid v6 structure.

'Area: API':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/Bibliophilarr.Api.V1/**/*'

'Area: Db-migration':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Datastore/Migration/*'

'Area: Download Clients':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Download/Clients/**/*'

'Area: Import Lists':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/ImportLists/**/*'

'Area: Indexer':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Indexers/**/*'

'Area: Notifications':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Notifications/**/*'

'Area: Organizer':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Organizer/**/*'

'Area: Parser':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Parser/**/*'

'Area: UI':
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**/*'
          - 'package.json'
          - 'yarn.lock'

# --- CI / build-infrastructure path coverage ---
# Mapped to the EXISTING `backend` label (build/CI infra is backend). No new
# labels are created in this repair PR: every top-level key below must already
# exist in the repository, otherwise actions/labeler (pull-requests:write,
# no label-creation) cannot apply it.
#
# NOTE: The following path classes were intentionally OMITTED from this repair
# because NO semantically-correct EXISTING label targets them, and creating new
# labels (`Area: Docs`, `Area: Governance`, `Area: CI`, `Area: Scripts`,
# `Area: Tests`) is a separate repository-governance improvement, not part of
# the broken-baseline repair:
#   - docs/** + **.md          (no existing docs-area label)
#   - .github/{agents,prompts,skills,instructions} + AGENTS.md  (no governance label)
#   - .github/workflows/** + build.sh/test.sh/Dockerfile etc. -> REMAPPED to `backend` (build/CI infra is backend)
#   - tests/** + src/**/*Test* (no existing testing-area label)
#   These are recorded as a follow-up governance task, per the no-new-label-taxonomy
#   directive for this repair.

'backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - '.github/workflows/**/*'
          - '.github/labeler.yml'
          - '.github/dependabot.yml'
          - 'build.sh'
          - 'test.sh'
          - 'docker-compose*.yml'
          - 'Dockerfile'
          - 'scripts/**/*'

'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'global.json'
          - 'package.json'
          - 'yarn.lock'
          - 'src/Directory.Packages.props'
          - 'src/NuGet.config'
