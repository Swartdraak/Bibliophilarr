# Labeler rules for actions/labeler@v6 (match-object schema).
# Each label maps to an array of condition objects; a PR is labeled when ANY
# condition matches.
# The `changed-files` matcher applies when at least one changed file matches one
# of the listed globs. This is the valid v6 structure.

'Area: API':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/Bibliophilarr.Api.V1/**/*'

'Area: Db-migration':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Datastore/Migration/*'

'Area: Download Clients':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Download/Clients/**/*'

'Area: Import Lists':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/ImportLists/**/*'

'Area: Indexer':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Indexers/**/*'

'Area: Notifications':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Notifications/**/*'

'Area: Organizer':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Organizer/**/*'

'Area: Parser':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Parser/**/*'

'Area: UI':
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**/*'
          - 'package.json'
          - 'yarn.lock'

# --- CI / build-infrastructure path coverage ---
# Mapped to the EXISTING `backend` label (build/CI infra is backend). The labeler
# loads this file from the trusted base state and emits the `label-policy` check.
#
# docs/**, .github/{agents,prompts,skills,instructions}, AGENTS.md, and
# tests/** are intentionally not remapped to `backend`; they have no existing
# semantically-correct label yet. Create dedicated area labels first if broader
# label coverage is desired.

'backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - '.github/workflows/**/*'
          - '.github/labeler.yml'
          - '.github/dependabot.yml'
          - 'build.sh'
          - 'test.sh'
          - 'docker-compose*.yml'
          - 'Dockerfile'
          - 'scripts/**/*'

'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'global.json'
          - 'package.json'
          - 'yarn.lock'
          - 'src/Directory.Packages.props'
          - 'src/NuGet.config'
