# Labeler rules for actions/labeler@v6 (match-object schema).
# Each label maps to an array of condition objects; a PR is labeled when ANY
# condition matches.
# The `changed-files` matcher applies when at least one changed file matches one
# of the listed globs. This is the valid v6 structure.

'area:api':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/Bibliophilarr.Api.V1/**/*'

'area:database':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Datastore/Migration/*'

'area:download-clients':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Download/Clients/**/*'

'area:import-lists':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/ImportLists/**/*'

'area:indexer':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Indexers/**/*'

'area:notifications':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Notifications/**/*'

'area:organizer':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Organizer/**/*'

'area:parser':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/NzbDrone.Core/Parser/**/*'

'area:frontend':
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**/*'
          - 'package.json'
          - 'yarn.lock'

'area:backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'

'area:ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**/*'
          - '.github/dependabot.yml'
          - 'build.sh'
          - 'test.sh'
          - 'docker-compose*.yml'
          - 'Dockerfile'
          - 'scripts/**/*'

'area:documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'
          - 'wiki/**/*'
          - '.github/PULL_REQUEST_TEMPLATE.md'
          - '.github/ISSUE_TEMPLATE/**/*'
          - '.github/copilot-instructions.md'
          - '.github/agents/**/*'
          - '.github/prompts/**/*'
          - '.github/skills/**/*'

'area:governance':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/labeler.yml'
          - '.github/label-actions.yml'
          - '.github/workflows/labeler.yml'
          - '.github/workflows/label-actions.yml'
          - 'BRANCHING.md'
          - 'README-GOVERNANCE-PACK.md'
          - '.github/copilot-instructions.md'

'area:dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'global.json'
          - 'package.json'
          - 'yarn.lock'
          - 'src/Directory.Packages.props'
          - 'src/NuGet.config'
