name: Bibliophilarr Release

# Publish stable tags from main and release-candidate tags from staging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (example: v1.2.3)'
        required: true
        type: string
      draft:
        description: 'Create release as draft'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release-source:
    uses: ./.github/workflows/release-source.yml
    with:
      requested-tag: ${{ inputs.tag }}

  release-entry-gate:
    name: Release Entry Gate
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Enforce release-entry evidence gates
        run: |
          mkdir -p _artifacts/release-entry
          python3 scripts/release_entry_gate.py \
            --max-age-days 7 \
            --md-out _artifacts/release-entry/release-entry-gate.md \
            --json-out _artifacts/release-entry/release-entry-gate.json

      - name: Upload release-entry gate artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-entry-gate
          path: _artifacts/release-entry

  build-package:
    needs: [release-source, release-entry-gate]
    uses: ./.github/workflows/package-assets.yml
    with:
      version: ${{ needs.release-source.outputs.version }}
      core-version: ${{ needs.release-source.outputs.core }}
    secrets:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

  draft-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-source, build-package]
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          name: release-assets

      - name: Confirm artifact checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2
        with:
          tag_name: ${{ needs.release-source.outputs.tag }}
          target_commitish: ${{ needs.release-source.outputs.commit }}
          prerelease: ${{ needs.release-source.outputs.prerelease == 'true' }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
            release-assets/release-manifest.json
