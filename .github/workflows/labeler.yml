name: "Pull Request Labeler"
on:
  - pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  # Legacy no-op job to clear the orphaned 'triage' check from the previous
  # pull_request_target-based workflow generation. Branch protection requires
  # that no stale failing checks block the merge; this job ensures the old
  # context is replaced with a passing result on every PR.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: "No-op (legacy context compatibility)"
        run: echo "Legacy triage context satisfied"

  label-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout trusted base branch for labeler"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
        # Use the trusted base-branch SHA for the workflow config so the labeler
        # policy cannot be sourced from untrusted PR-controlled content. The PR
        # changed-file set is still evaluated against the candidate branch, but the
        # label mapping itself is loaded from the repository's approved base state.
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
      - name: Enforce PR metadata contract
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((label) => label.name.toLowerCase());
            const assignees = pr.assignees || [];
            const body = pr.body || '';
            const errors = [];

            const hasPrefix = (prefix) => labels.some((label) => label.startsWith(prefix));

            if (!hasPrefix('type:')) {
              errors.push('missing a type:* label');
            }

            if (!hasPrefix('area:')) {
              errors.push('missing an area:* label');
            }

            if (!hasPrefix('priority:')) {
              errors.push('missing a priority:* label');
            }

            if (!hasPrefix('risk:')) {
              errors.push('missing a risk:* label');
            }

            if (assignees.length === 0) {
              errors.push('missing an assignee');
            }

            const requiredBodyChecks = [
              [/^## Summary/m, 'missing ## Summary section'],
              [/^## Scope/m, 'missing ## Scope section'],
              [/^## Validation/m, 'missing ## Validation section'],
              [/^## Risk and rollback/m, 'missing ## Risk and rollback section'],
              [/^## Issue linkage/m, 'missing ## Issue linkage section'],
              [/Candidate SHA/i, 'missing Candidate SHA metadata'],
              [/(Fixes|Closes|Relates to)\s+#\d+/i, 'missing linked issue reference'],
            ];

            for (const [pattern, message] of requiredBodyChecks) {
              if (!pattern.test(body)) {
                errors.push(message);
              }
            }

            if (errors.length > 0) {
              core.setFailed(`PR metadata contract failed: ${errors.join('; ')}`);
            }
