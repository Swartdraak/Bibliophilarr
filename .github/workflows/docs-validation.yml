name: Docs Validation

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16
        with:
          globs: |
            README.md
            QUICKSTART.md
            ROADMAP.md
            MIGRATION_PLAN.md
            PROJECT_STATUS.md
            CONTRIBUTING.md
            SECURITY.md
            CHANGELOG.md
            docs/operations/METADATA_MIGRATION_DRY_RUN.md
            docs/operations/METADATA_PROVIDER_RUNBOOK.md
            docs/operations/RELEASE_AUTOMATION.md
