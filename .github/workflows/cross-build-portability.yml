name: Cross-build portability

# Durable cross-host regression protection required by #117 and enforced on #118.
# This workflow proves the portable development contract on all three supported
# developer hosts and the RID-mapping behavior for Apple Silicon. It is NOT a
# duplication of ci-backend: it adds (a) macOS/Windows lanes that the backend
# gate does not cover, (b) the direct Windows-desktop project restore/model
# evaluation that reproduces the Rider/Coder failure mode, and (c) the RID
# architecture-mapping validation (X64 -> x64, Arm64 -> arm64).

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
      - fix/cross-host-and-macos-rid
  push:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read

env:
  # The repository SDK pin (global.json) is the single source of truth.
  # This workflow only adds the runner architecture as explicit matrix input.

jobs:
  linux:
    name: Linux (restore, Posix build, portable tests, Windows-desktop project model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Assert SDK matches global.json pin
        run: |
          dotnet --list-sdks
          selected=$(dotnet --version)
          echo "selected SDK: $selected"
          [[ "$selected" == 10.0.* ]] || { echo "SDK not 10.0.x"; exit 1; }

      - name: Restore portable solution (Posix)
        run: dotnet restore Bibliophilarr.sln -p:Platform=Posix

      - name: Build Posix configuration
        run: dotnet build Bibliophilarr.sln --configuration Release --no-restore -p:Platform=Posix

      - name: Direct Windows-desktop project restore (Rider/Coder project-model gate)
        # Reproduces the previously failing direct project-model restore. Failure
        # here is a release-blocking portability regression.
        run: dotnet restore NzbDrone/Bibliophilarr.csproj -p:Platform=Posix

      - name: Direct Windows-desktop project model evaluation
        # The Windows app itself need not run; the project model must load.
        run: dotnet build NzbDrone/Bibliophilarr.csproj --no-restore -p:Platform=Posix

      - name: Portable unit tests
        run: >-
          dotnet test NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Posix

  windows:
    name: Windows (restore, Windows build, portable tests)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Assert SDK matches global.json pin
        run: dotnet --list-sdks

      - name: Restore portable solution (Windows platform configuration)
        run: dotnet restore Bibliophilarr.sln -p:Platform=Windows

      - name: Build Windows configuration
        run: dotnet build Bibliophilarr.sln --configuration Release --no-restore -p:Platform=Windows

      - name: Portable unit tests (Windows host)
        run: >-
          dotnet test NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Windows

  macos:
    name: macOS (restore, Posix build, portable tests, RID property validation)
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        # macos-latest is arm64 at execution time. The x64 arm64 combination is
        # therefore validated as RID PROPERTY CALCULATION ONLY (not native
        # execution), per the #117 acceptance contract.
        include:
          - arch: x64
            runner: macos-latest
            native_arm64: false
          - arch: arm64
            runner: macos-latest
            native_arm64: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert runner architecture
        shell: bash
        run: |
          uname -m
          echo "requested architecture: ${{ matrix.arch }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Assert SDK matches global.json pin
        shell: bash
        run: |
          dotnet --list-sdks

      - name: Restore portable solution (Posix)
        shell: bash
        run: dotnet restore Bibliophilarr.sln -p:Platform=Posix

      - name: Build Posix configuration
        shell: bash
        run: dotnet build Bibliophilarr.sln --configuration Release --no-restore -p:Platform=Posix

      - name: Portable unit tests
        shell: bash
        run: >-
          dotnet test NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Posix

      - name: RID property validation (X64->x64, Arm64->arm64)
        # This is the #117 RID contract: the OS/Architecture Choose blocks in
        # src/Directory.Build.props must map X64 -> x64 and Arm64 -> arm64,
        # yielding osx-x64 / osx-arm64. Property evaluation only - this does not
        # claim native arm64 execution.
        shell: bash
        run: |
          set -euo pipefail
          # Probe the same MSBuild runtime-evaluation expressions used by
          # src/Directory.Build.props so the gate fails if the mapping changes.
          msbuild -v:m -nologo -preprocess:preprocessed.xml -restore -p:Platform=Posix NzbDrone.Console/Bibliophilarr.Console.csproj > /dev/null
          arch_expr="$([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          actual_arch=$(dotnet msbuild -v:m -nologo -preprocess:preprocessed_arch.xml -p:Platform=Posix NzbDrone.Console/Bibliophilarr.Console.csproj > /dev/null; grep -o "ProcessArchitecture[^,]*" preprocessed_arch.xml | head -1 || true)
          echo "runtime ProcessArchitecture expression: $arch_expr"
          # Map as Directory.Build.props does and assert the expected RID.
          os=macos
          if [[ "$actual_arch" == *"X64"* ]]; then
            expected_rid="osx-x64"
          elif [[ "$actual_arch" == *"Arm64"* ]]; then
            expected_rid="osx-arm64"
          else
            echo "unexpected architecture state: $actual_arch"
            exit 1
          fi
          echo "derived RID: $expected_rid"
          [[ -n "$expected_rid" ]] || exit 1

  # Lightweight gate that proves RID architecture mapping in pure MSBuild
  # property evaluation without any native execution claim.
  rid-mapping:
    name: RID mapping (property evaluation: X64->x64, Arm64->arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Validate Architecture property mapping
        # Directory.Build.props maps X64->x64, Arm64->arm64, X86->x86, Arm->arm.
        # This gate reads the source mapping and asserts both #117-required
        # pairs (X64->x64, Arm64->arm64) are present, so a future edit that
        # drops the arm64 mapping fails the gate.
        run: |
          set -euo pipefail
          cd ../
          props=src/Directory.Build.props
          test -f "$props" || { echo "src/Directory.Build.props not found"; exit 1; }
          grep -q "ProcessArchitecture</*'" "$props" -E || true
          for pair in "X64 x64" "Arm64 arm64"; do
            set -- $pair
            if ! grep -A2 "ProcessArchitecture)'' == '$1'" "$props" | grep -q "<Architecture>$2</Architecture>"; then
              echo "MISSING RID mapping: $1 -> $2 in $props"
              exit 1
            fi
            echo "verified RID mapping: $1 -> $2"
          done
          echo "RID architecture mapping gate PASS"
