name: Bibliophilarr npm Publish

# Publish versions from existing stable or release-candidate tags.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tagged npm version (x.y.z or x.y.z-rc.N)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-source:
    uses: ./.github/workflows/release-source.yml
    with:
      requested-tag: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || '' }}

  publish:
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    defaults:
      run:
        working-directory: npm/bibliophilarr-launcher

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
        env:
          RELEASE_VERSION: ${{ needs.release-source.outputs.version }}

      - name: Publish package
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ needs.release-source.outputs.prerelease == 'true' && 'next' || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
