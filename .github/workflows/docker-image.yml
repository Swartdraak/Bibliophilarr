name: Bibliophilarr Docker Image

# Build manually from main or publish from a verified release tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GHCR (requires a stable tag on the selected main commit)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-source:
    uses: ./.github/workflows/release-source.yml
    with:
      use-current-stable: true
      build-only: ${{ github.event_name == 'workflow_dispatch' && !inputs.push }}

  docker:
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write   # Required for cosign keyless signing via OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/bibliophilarr
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release-source.outputs.tag }},enable=${{ needs.release-source.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ needs.release-source.outputs.prerelease == 'false' }}

      - name: Build (and optionally push)
        id: build-push
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          secret-envs: sixlabors_license=SIXLABORS_LICENSE_KEY
          build-args: BIBLIOPHILARRVERSION=${{ needs.release-source.outputs.core }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        if: github.event_name == 'push' || inputs.push
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Docker image with cosign (keyless)
        if: github.event_name == 'push' || inputs.push
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Verify the published image signature
        if: github.event_name == 'push' || inputs.push
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx did not provide a valid image digest." >&2
            exit 1
          fi

          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bibliophilarr"
          for attempt in 1 2 3; do
            if timeout --kill-after=5s 45s cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${repository}@${DIGEST}"; then
              exit 0
            fi

            echo "Image signature verification attempt $attempt failed." >&2
            if (( attempt < 3 )); then
              sleep "$((attempt * 5))"
            fi
          done

          exit 1

      - name: Smoke test image locally
        if: github.event_name == 'workflow_dispatch' && !inputs.push
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          docker build --secret id=sixlabors_license,env=SIXLABORS_LICENSE_KEY -t bibliophilarr:local .
          docker run --rm -d -p 8787:8787 \
            --name bibliophilarr-local bibliophilarr:local
          sleep 20
          docker logs bibliophilarr-local | tail -n 100 || true
          docker rm -f bibliophilarr-local

      - name: Build local image for scanning
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          secret-envs: sixlabors_license=SIXLABORS_LICENSE_KEY
          tags: bibliophilarr:scan

      - name: Run Trivy vulnerability scanner
        continue-on-error: true  # Advisory: base image vulns should not block release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliophilarr:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bibliophilarr:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
