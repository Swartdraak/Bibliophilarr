name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enforce explicit HTTP mutation binding
        working-directory: .
        run: bash scripts/ops/check_http_binding.sh

      - name: Verify Linux acceptance preflight on a read-only mount
        working-directory: .
        run: >-
          sudo --non-interactive unshare --mount --net --propagation private
          env REQUIRE_READONLY_BIND=1 bash linux-program/tests/check_preflight_readonly.sh

      - name: Verify Linux integrations plan setup binding
        working-directory: .
        run: python3 linux-program/tests/check_integrations_setup.py

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Provision Six Labors license
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          echo "$SIXLABORS_LICENSE_KEY" > "$RUNNER_TEMP/sixlabors.lic"
          chmod 600 "$RUNNER_TEMP/sixlabors.lic"
          echo "SIXLABORS_LICENSE_FILE=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Bibliophilarr.sln -p:Platform=Posix

      - name: Build
        run: dotnet build Bibliophilarr.sln --configuration Release --no-restore -p:Platform=Posix

      - name: Test
        run: >-
          dotnet test NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Posix

  rid-core-common-targeted:
    name: RID Core/Common Targeted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Provision Six Labors license
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          echo "$SIXLABORS_LICENSE_KEY" > "$RUNNER_TEMP/sixlabors.lic"
          chmod 600 "$RUNNER_TEMP/sixlabors.lic"
          echo "SIXLABORS_LICENSE_FILE=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"

      - name: Build backend runtime for RID test resolution
        run: |
          cd ..
          ./build.sh --backend -r linux-x64 -f net10.0

      # RID common targeted step.
      # HttpClientFixture is deliberately NOT here: it contains the cross-culture
      # malformed-cookie tests that were made deterministic against an in-process
      # HTTP listener and are covered in the required `build-test` unit lane.
      # Keeping only the process/rate-limit fixtures (which exercise real
      # Process/Timer/RID-sensitive behavior) keeps this step deterministic.
      - name: Run RID-targeted common fixtures
        run: >-
          dotnet test NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj
          --configuration Release --verbosity minimal -p:Platform=Posix -r linux-x64
          --filter
          'FullyQualifiedName~RateLimitServiceFixture|FullyQualifiedName~ProcessProviderFixture'

      # RID core targeted step.
      # The previous filter referenced OpenLibraryIsbnAsinLookupFixture, which does
      # not exist in src (selecting zero tests). It is replaced with
      # OpenLibrarySearchProxyFixture, a real Core.MetadataSource fixture.
      # AddAuthorFixture (class in src/NzbDrone.Core.Test/MusicTests/AddArtistFixture.cs)
      # and MetadataProviderOrchestratorFixture are real and selected here.
      - name: Run RID-targeted core fixtures
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --verbosity minimal -p:Platform=Posix -r linux-x64
          --filter
          'FullyQualifiedName~AddAuthorFixture|FullyQualifiedName~MetadataProviderOrchestratorFixture|FullyQualifiedName~OpenLibrarySearchProxyFixture|FullyQualifiedName~WhereBuilder|FullyQualifiedName~HistoryRepositoryFixture'

      - name: Set up Node for the browser package
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'

      - name: Package the existing Linux runtime and production UI
        working-directory: .
        run: |
          rm -f -- "$SIXLABORS_LICENSE_FILE"
          corepack enable
          ./build.sh --frontend --packages -r linux-x64 -f net10.0

      - name: Set up Python for browser smoke
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Playwright Chromium
        working-directory: .
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browser-smoke-chromium
        run: |
          python -m venv "$RUNNER_TEMP/browser-smoke-venv"
          "$RUNNER_TEMP/browser-smoke-venv/bin/python" -m pip install -r tests/browser/requirements.txt
          "$RUNNER_TEMP/browser-smoke-venv/bin/python" -m playwright install --with-deps --only-shell chromium

      - name: Smoke-test the WebUI with loopback-only Chromium and app
        working-directory: .
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browser-smoke-chromium
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/browser-smoke-evidence"
          mkdir -m 700 "$evidence"
          printf 'Candidate %s\n' "$GITHUB_SHA" > "$evidence/results.log"

          # The private network namespace has only loopback. Run the app and
          # Chromium as the runner user after bringing that interface up.
          sudo --non-interactive --preserve-env=HOME,DOTNET_ROOT,DOTNET_ROOT_X64,PLAYWRIGHT_BROWSERS_PATH \
            unshare --net --fork --kill-child bash -c '
              set -euo pipefail
              ip link set lo up
              exec setpriv --reuid "$1" --regid "$2" --init-groups -- "${@:3}"
            ' bash "$(id -u)" "$(id -g)" "$RUNNER_TEMP/browser-smoke-venv/bin/python" \
              tests/browser/smoke.py \
              --binary _artifacts/linux-x64/net10.0/Bibliophilarr/Bibliophilarr \
              --evidence "$evidence" 2>&1 | tee -a "$evidence/results.log"

      - name: Verify packaged dual-format catalogue recovery after SIGTERM
        working-directory: .
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browser-smoke-chromium
        run: |
          set -euo pipefail
          umask 077
          evidence="$RUNNER_TEMP/browser-smoke-evidence"
          tls="$(mktemp -d "$RUNNER_TEMP/dual-format-tls.XXXXXXXX")"
          trap 'rm -rf -- "$tls"' EXIT
          mkdir "$tls/empty-trust"
          printf '%s\n' '127.0.0.1 localhost openlibrary.org' > "$tls/hosts"
          printf '%s\n' 'subjectAltName=DNS:openlibrary.org' 'extendedKeyUsage=serverAuth' > "$tls/extensions"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -subj '/CN=Bibliophilarr CI fixture CA' -keyout "$tls/ca.key" -out "$tls/ca.crt" > "$tls/cert.log" 2>&1
          openssl req -newkey rsa:2048 -nodes -sha256 -subj '/CN=openlibrary.org' \
            -keyout "$tls/leaf.key" -out "$tls/leaf.csr" >> "$tls/cert.log" 2>&1
          openssl x509 -req -CAcreateserial -days 1 -sha256 -in "$tls/leaf.csr" -CA "$tls/ca.crt" \
            -CAkey "$tls/ca.key" -extfile "$tls/extensions" -out "$tls/leaf.crt" >> "$tls/cert.log" 2>&1
          openssl verify -CAfile "$tls/ca.crt" -verify_hostname openlibrary.org "$tls/leaf.crt"

          # Private mounts keep the provider alias off the runner host. Lower the
          # privileged-port threshold in this network namespace before dropping root.
          sudo --non-interactive --preserve-env=HOME,DOTNET_ROOT,DOTNET_ROOT_X64,PLAYWRIGHT_BROWSERS_PATH \
            unshare --net --mount --propagation private --fork --kill-child bash -c '
              set -euo pipefail
              ip link set lo up
              test "$(ip -o link show | wc -l)" -eq 1
              test -z "$(ip route show)"
              test -z "$(ip -6 route show)"
              mount --bind "$1/hosts" /etc/hosts
              sysctl -q -w net.ipv4.ip_unprivileged_port_start=443
              exec setpriv --reuid "$2" --regid "$3" --init-groups --no-new-privs --bounding-set=-all -- "${@:4}"
            ' bash "$tls" "$(id -u)" "$(id -g)" "$RUNNER_TEMP/browser-smoke-venv/bin/python" -B \
              tests/browser/dual_format_recovery.py \
              --binary _artifacts/linux-x64/net10.0/Bibliophilarr/Bibliophilarr --evidence "$evidence" \
              --tls "$tls" --migrations src/NzbDrone.Core/Datastore/Migration 2>&1 | tee -a "$evidence/results.log"

      - name: Upload safe browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-webui-smoke
          path: ${{ runner.temp }}/browser-smoke-evidence/
          if-no-files-found: ignore
          retention-days: 7

  metadata-provider-fixtures:
    name: Metadata Provider Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Provision Six Labors license
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          echo "$SIXLABORS_LICENSE_KEY" > "$RUNNER_TEMP/sixlabors.lic"
          chmod 600 "$RUNNER_TEMP/sixlabors.lic"
          echo "SIXLABORS_LICENSE_FILE=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Bibliophilarr.sln -p:Platform=Posix

      - name: Run validated metadata core fixtures
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --no-restore --verbosity minimal -p:Platform=Posix
          --filter
          'FullyQualifiedName~MetadataProviderOrchestratorFixture|FullyQualifiedName~GoogleBooksFallbackSearchProviderFixture|FullyQualifiedName~ImportListSyncServiceFixture|FullyQualifiedName~OpenLibraryClientResilienceFixture|FullyQualifiedName~InventaireClientResilienceFixture|FullyQualifiedName~OpenLibraryIdBackfillServiceFixture|FullyQualifiedName~RefreshAuthorProviderOutageFixture|FullyQualifiedName~BookSearchFallbackExecutionServiceFixture'

      - name: Run host composition fixtures
        run: >-
          dotnet test NzbDrone.Host.Test/Bibliophilarr.Host.Test.csproj
          --configuration Release --no-restore --verbosity minimal -p:Platform=Posix
          --filter 'FullyQualifiedName~ContainerFixture|FullyQualifiedName~NestedAuthorBookAddFixture|FullyQualifiedName~ApiWriteAuthorizationFixture|FullyQualifiedName~FreshStartupRecoveryFixture'

      - name: Verify persistent user password storage
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Posix
          --filter 'FullyQualifiedName~UserServicePasswordFixture'

      - name: Verify author identity and path handling
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --no-build --no-restore --verbosity minimal -p:Platform=Posix
          --filter 'FullyQualifiedName~AuthorPathValidatorFixture|FullyQualifiedName~AuthorCanonicalizationServiceFixture|FullyQualifiedName~AddAuthorPersistenceFixture|FullyQualifiedName~AddBookFixture|FullyQualifiedName~RefreshSeriesServiceConcurrencyFixture'

      - name: Run library import selection and book format search fixtures
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Posix
          --filter
          'FullyQualifiedName~IdentificationServiceFormatFixture|FullyQualifiedName~CandidateServiceFixture|FullyQualifiedName~ImportDecisionMakerIssue275Fixture|FullyQualifiedName~ImportApprovedBooksFormatFixture|FullyQualifiedName~CandidateServiceIssue340Fixture|FullyQualifiedName~ManualImportServiceExecute|FullyQualifiedName~BookSearchServiceMissingFormatFixture|FullyQualifiedName~ScopedCutoffRepositoryFixture|FullyQualifiedName~QueueSpecificationFixture|FullyQualifiedName~AudioTagPayloadFixture'

      - name: Verify stored command results
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --no-build --no-restore --verbosity minimal -p:Platform=Posix
          --filter 'FullyQualifiedName~CommandRepositoryFixture'

      - name: Verify SQLite migration recovery and interruption
        run: >-
          dotnet test NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj
          --configuration Release --no-build --verbosity minimal -p:Platform=Posix
          --filter 'FullyQualifiedName~SqliteMigrationRecoveryFixture|FullyQualifiedName~should_recover_after_kill_inside_a_sqlite_migration_transaction'

      - name: Run metadata, format monitoring, manual import and host configuration API fixtures
        run: >-
          dotnet test Bibliophilarr.Api.Test/Bibliophilarr.Api.Test.csproj
          --configuration Release --no-restore --verbosity minimal -p:Platform=Posix
          --filter
          'FullyQualifiedName~MetadataProvidersControllerFixture|FullyQualifiedName~MetadataProviderConfigResourceMapperFixture|FullyQualifiedName~BookFormatMonitoringProjectionFixture|FullyQualifiedName~BookFormatStatusResourceFixture|FullyQualifiedName~BookControllerEventGuardFixture|FullyQualifiedName~HostConfigCredentialValidationFixture|FullyQualifiedName~BootstrapControllerIssue313Fixture|FullyQualifiedName~AuthenticationServiceIssue369Fixture|FullyQualifiedName~ApiKeyAuthenticationHandlerFixture|FullyQualifiedName~ApiWriteAuthenticationMiddlewareFixture|FullyQualifiedName~ManualImportControllerFixture|FullyQualifiedName~AuthorEditorControllerIssue236Fixture|FullyQualifiedName~CalendarFeedControllerFixture|FullyQualifiedName~BookReleaseFormatFixture'

  metadata-diagnostics-integration:
    name: Metadata Diagnostics Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Provision Six Labors license
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          echo "$SIXLABORS_LICENSE_KEY" > "$RUNNER_TEMP/sixlabors.lic"
          chmod 600 "$RUNNER_TEMP/sixlabors.lic"
          echo "SIXLABORS_LICENSE_FILE=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"

      - name: Build backend runtime for integration harness
        run: |
          cd ..
          ./build.sh --backend -r linux-x64 -f net10.0

      - name: Run metadata diagnostics and API wire-contract fixtures
        run: >-
          dotnet test NzbDrone.Integration.Test/Bibliophilarr.Integration.Test.csproj
          --configuration Debug --verbosity minimal -p:Platform=Posix
          --filter
          'FullyQualifiedName~MetadataProviderDiagnosticsFixture|FullyQualifiedName~MetadataConflictTelemetryFixture|FullyQualifiedName~SearchTelemetryFixture|FullyQualifiedName~HostConfigAuthorizationFixture|FullyQualifiedName~ApiAuthzContractIssue403AnonymousApiGetFixture|FullyQualifiedName~AuthorLookupFixture|FullyQualifiedName~RootFolderFixture|FullyQualifiedName~ConfigWireContractFixture'

      - name: Run catalogue and provider integration fixtures
        run: >-
          dotnet test NzbDrone.Integration.Test/Bibliophilarr.Integration.Test.csproj
          --configuration Debug --no-build --verbosity minimal -p:Platform=Posix
          --filter
          'FullyQualifiedName~AuthorEditorFixture|FullyQualifiedName~CalendarFixture|FullyQualifiedName~CutoffUnmetFixture|FullyQualifiedName~MissingFixture|FullyQualifiedName~OpenLibraryRefreshBaselineFixture|FullyQualifiedName~AuthorReresolutionFixture'
