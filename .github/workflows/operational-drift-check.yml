name: Operational Drift Check

'on':
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 2'

permissions:
  contents: read

jobs:
  operational-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Generate operational drift report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _artifacts/operational-drift
          python3 scripts/operational_drift_report.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --md-out _artifacts/operational-drift/operational-drift.md \
            --json-out _artifacts/operational-drift/operational-drift.json

      - name: Upload operational drift artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-drift-report
          path: _artifacts/operational-drift