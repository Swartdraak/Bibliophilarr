name: Build Release Packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      core-version:
        required: true
        type: string
    secrets:
      SIXLABORS_LICENSE_KEY:
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Build and Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
          - os: windows-2025
            rid: win-x64

    steps:
      - name: Checkout verified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'

      - name: Enable Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.19 --activate
          yarn --version

      - name: Build backend
        shell: bash
        env:
          PACKAGE_RID: ${{ matrix.rid }}
          BIBLIOPHILARRVERSION: ${{ inputs.core-version }}
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          : "${SIXLABORS_LICENSE_KEY:?Set the Six Labors build license}"
          license="$RUNNER_TEMP/sixlabors.lic"
          trap 'rm -f -- "$license"' EXIT
          (umask 077; printf '%s\n' "$SIXLABORS_LICENSE_KEY" > "$license")
          export SIXLABORS_LICENSE_FILE="$license"
          ./build.sh --backend -r "$PACKAGE_RID" -f net10.0

      - name: Build frontend
        shell: bash
        run: ./build.sh --frontend

      - name: Assemble package
        shell: bash
        env:
          PACKAGE_RID: ${{ matrix.rid }}
        run: ./build.sh --packages -r "$PACKAGE_RID" -f net10.0

      - name: Archive Unix package
        if: runner.os != 'Windows'
        shell: bash
        env:
          PACKAGE_RID: ${{ matrix.rid }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          tar -C "_artifacts/$PACKAGE_RID/net10.0" \
            -czf "release/bibliophilarr-$RELEASE_VERSION-$PACKAGE_RID.tar.gz" Bibliophilarr

      - name: Archive Windows package
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive `
            -Path "_artifacts/win-x64/net10.0/Bibliophilarr/*" `
            -DestinationPath "release/bibliophilarr-${env:RELEASE_VERSION}-win-x64.zip"

      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        shell: bash
        env:
          MAJORVERSION: ${{ inputs.core-version }}
          MINORVERSION: '0'
          BIBLIOPHILARRVERSION: ${{ inputs.core-version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./build.sh --installer -r win-x64 -f net10.0
          cp "distribution/windows/setup/output/Bibliophilarr.$BIBLIOPHILARRVERSION.win-x64.exe" \
            "release/bibliophilarr-$RELEASE_VERSION-win-x64-setup.exe"

      - name: Smoke-test Windows installer
        timeout-minutes: 8
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./distribution/windows/setup/test-installer.ps1 `
            -InstallerPath "release/bibliophilarr-${env:RELEASE_VERSION}-win-x64-setup.exe" `
            -HostedRunner

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-${{ matrix.rid }}
          path: release/*
          retention-days: 1
          if-no-files-found: error

  collect:
    name: Verify package set and checksums
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download package parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: release-part-*
          merge-multiple: true

      - name: Verify package set and generate checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          python3 scripts/ops/check_release_assets.py release-assets "$RELEASE_VERSION"
          python3 scripts/ops/create_release_manifest.py release-assets "$RELEASE_VERSION" "$source_commit" "$SOURCE_REPOSITORY"
          (
            cd release-assets
            sha256sum release-manifest.json >> SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
