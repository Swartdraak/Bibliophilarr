name: Package Rehearsal

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/package-*.yml'
      - '.github/workflows/release.yml'
      - 'build.sh'
      - 'distribution/windows/setup/**'
      - 'scripts/ops/check_release_assets.py'
      - 'scripts/ops/create_release_manifest.py'
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/staging' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/package-assets.yml
    with:
      version: 0.0.0-rehearsal.${{ github.run_id }}.${{ github.run_attempt }}
      core-version: '0.0.0'
    secrets:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
