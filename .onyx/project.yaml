      note: "Issue #325 regression (POST /api/v1/author 500 NRE + post-create refresh deleting the freshly created local author), pinned by existing PR #326 (4 commits, 4 files: RefreshAuthorService.cs, FileNameBuilder.cs, RefreshArtistServiceFixture.cs, GetAuthorFolderFixture.cs). DEFECT 1 — folder-name NRE: FileNameBuilder.AddAuthorTokens now null-guards author.Name/CleanName/Metadata so a freshly constructed local author (metadata value not yet provider-resolved) can no longer throw 'Object reference not set' and 500 the add. DEFECT 2 — post-create delete: AddAuthorService upserts an AuthorMetadata row for every added author and assigns the resulting POSITIVE id to Author.AuthorMetadataId, so the old 'AuthorMetadataId <= 0' no-delete guard (issue #272) no longer identified locally created authors; the post-create RefreshAuthorCommand then deleted the persisted row ~3s after the 201. ShouldDelete now keys on the PROVIDER ID SCOPE (ProviderOwnedForeignId: openlibrary:author:... / bare OLxxxxA via OpenLibraryIdNormalizer, hardcover:...): only provider-scoped ids can be provider-removed, so synthetic/unmapped ids (e.g. recovery:author:RTA-001) are retained regardless of AuthorMetadataId; provider-sourced authors keep the documented #204/#209 provider-removed deletion. RE-VERIFIED 2026-10-23 in-container at work-branch head 8def6a38 (registered PR head 9970dccf + catch-up merge of develop c2513d5e, zero conflicts; task t_4906a68c): filter GREEN 30/30 — RefreshAuthorServiceFixture (21 tests incl. 4 new #325 tests: positive-metadata-id + synthetic-id no-delete single/bulk, provider-scope deletion 3-case matrix, files-present no-delete) + GetAuthorFolderFixture (9 tests incl. 2 new null-name NRE-guard tests). Companion RefreshArtistServiceFixture (MusicTests namespace, same file path) aligns the 2 pre-existing synthetic-id not-found tests to the provider-scope gate (no-delete for synthetic ids; the documented provider-removed deletion is now exercised via provider-scoped