pre_existing_faults:
  - name: core-test-suite-failures
    severity: medium
    description: >
      Bibliophilarr.Core.Test has 108 deterministic pre-existing failures out of
      2767 (2600 passed, 59 skipped) in the isolated audit environment
      (2026-09-18, develop d21d1361c, net10.0 band; the main band showed 103/2765
      on 2026-09-17, same failure classes). Error classes: InvalidOperationException
      (75), FluentAssertions "Expected boolean" (16), NullReferenceException (4),
      Moq.MockException unmet expectations (3), NotSupportedException (3),
      DownloadClientException (2), ImportException (1), other (4). Failures
      concentrate in DownloadClient fixtures (93/108: QBittorrent/Nzbget/Sabnzbd/
      NzbVortex/RTorrent/Transmission/DownloadStation/Hadouken/CompletedDownloadService),
      plus MediaFiles (4), Profiles (3), BooksTests (2), Datastore (2), MusicTests (2),
      BookTests (1), Housekeeping (1). This is a pre-existing condition of the
      fork's test suite, NOT introduced by onboarding; the repo's own CI
      (ci-backend.yml) runs targeted fixture filters rather than the full Core
      suite, and all targeted filters verified in this audit are green.
      Evidence: logs/develop-15-core-full.log.
  - name: pinned-nuget-feed-401
    severity: low
    description: >
      QUICKSTART.md states src/NuGet.config "includes the Servarr package feeds
      required for FluentMigrator, SQLite, Mono.Posix", but the checked-in
      NuGet.config (develop blob 296a5db4) contains only
      nuget.org. The pinned Azure DevOps feed (pkgs.dev.azure.com/Servarr/v3)
      returns 401 anonymously, so restore actually resolves everything from
      nuget.org. Documentation drift, not a build break — restore and build
      succeed — but the docs overstate the feed dependency.
  - name: eslint-negated-condition-warnings
    severity: low
    description: >
      yarn lint reports 7 pre-existing no-negated-condition warnings
      (frontend/src). 0 errors; lint gate passes.
  - name: openapi-json-test-path-resolution
    severity: low
    description: >
      OpenApiIdentifierContractFixture.openapi_should_not_expose_legacy_goodreads_identifier_contracts
      fails in isolated worktrees with 'Unable to resolve src/Bibliophilarr.Api.V1/openapi.json
      from test directory' (verified pre-existing at develop 6332741e on a pristine
      worktree, 2026-10-03, issue #252 run). The test walks UP from the test output
      directory looking for <ancestor>/src/Bibliophilarr.Api.V1/openapi.json; with the
      per-task output overrides used in the audit container (BibliophilarrRootDir
      relocation) the test directory no longer sits under a tree that contains
      src/Bibliophilarr.Api.V1, so resolution fails. In-repo/CI checkouts resolve
      fine. Environment-dependent test-path fault, not a code regression; GitHub
      CI remains the authority for this fixture.
  - name: processprovider-needs-dotnet-root
    severity: low
    description: >
      ProcessProviderFixture tests spawn the Bibliophilarr.Test.Dummy app host,
      which requires .NET to be discoverable (DOTNET_ROOT or PATH).
      In CI (actions/setup-dotnet) this is satisfied; in isolated containers
      with a non-standard dotnet install they fail with
      "Failed to resolve libhostfxr.so" unless DOTNET_ROOT is exported.
      Environment setup gap, not a code fault: with DOTNET_ROOT set,
      the full Common suite passes (621/621 non-skipped).
