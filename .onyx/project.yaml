      note: "Issue #296 regression: POST /api/v1/command with a command name matching no registered Command implementation must return 400 (BadRequest), never 500. Before the fix, CommandController.StartCommand used Enumerable.Single, which throws InvalidOperationException when zero implementations match; BibliophilarrErrorPipeline maps that to HttpStatusCode.InternalServerError and logs it at Fatal, producing a 500 for a benign client-input condition. The endpoint now resolves the type with FirstOrDefault and throws a 400 BadRequestException when the name is unknown, and reads the raw request body up front (no behavior change for the error path). Pinned by CommandControllerUnknownNameIssue296Fixture (5 tests: 3 unknown-name cases -> 400 ApiException not 500/InvalidOperationException; ApplicationUpdateCommand guard preserved -> 400 with disabled message; resolvable name not rejected by the guard -> 201 CreatedAtActionResult). RE-VERIFIED 2026-10-18 at head 816bd8d3e8 (work branch fix/issue-296-command-unknown-name-4xx, run t_56e08eff): RED 4-failed at base (3 unknown-name -> InvalidOperationException @ CommandController.cs:55; 1 resolvable blocked at Request.Body) / GREEN 5-passed post-fix; full NzbDrone.Api.Test suite 80/80; full solution Release build 0 warn/0 err. The durable end-to-end HTTP acceptance (unknown-name -> 4xx over the wire) is exercised in the application-test stage; the existing NzbDrone.Integration.Test CommandFixture is [Ignore]d and requires Postgres, so this unit-level fixture is the CI-parity guard."
