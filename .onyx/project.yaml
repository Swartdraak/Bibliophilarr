version: 1
name: bibliophilarr
canonical_repo: https://github.com/Swartdraak/Bibliophilarr
immutable_repo_id: 1159029625
default_branch: main
integration_branch: develop
promotion_path: [develop, staging, main]
human_gates: [stable-release, hotfix]
license: GPL-3.0
runtime_port: 8787

components:
  backend:
    path: src
    language: csharp
    solution: src/Bibliophilarr.sln
    framework: net10.0
    build_platform: Posix          # -p:Platform=Posix required on Linux/macOS
    nuget_config: src/NuGet.config # nuget.org only; pinned Servarr feed is 401 and NOT used
  frontend:
    path: frontend
    language: typescript
    bundler: webpack
    test_runner: jest
    package_manager: yarn@1.22.19
  host_app:
    path: src/NzbDrone.Console
    output: _output/net10.0/linux-x64/Bibliophilarr
    packaged: _artifacts/linux-x64/net10.0/Bibliophilarr/Bibliophilarr
  windows_desktop:
    path: src/NzbDrone
    framework: net10.0-windows
    note: WinForms shell; runnable on Windows only. On Linux/macOS the project model must still restore/build (EnableWindowsTargeting) — this is the Rider/Coder portability gate.

toolchain:
  dotnet: "10.0.x (verified 10.0.401; global.json pins 10.0.100, rollForward latestFeature)"
  node: "22.x per repo docs (verified locally on v20.20.2 — frontend gates pass on both)"
  yarn: "1.22.19"

commands:
  bootstrap:
    - name: yarn-install
      command: yarn install --frozen-lockfile
      cwd: .
    - name: dotnet-restore
      command: dotnet restore src/Bibliophilarr.sln -p:Platform=Posix
      cwd: .
  lint:
    - name: eslint
      command: yarn lint
      cwd: .
      note: 7 pre-existing warnings, 0 errors (no-negated-condition in frontend/src)
    - name: ui-build-mode-guard
      command: ./scripts/ops/check_ui_build_mode.sh
      cwd: .
      note: >
        Issue #252 regression guard (added in fix/issue-252-release-ui-eval-bundle):
        asserts the 'yarn build' script pins BIBLIOPHILARR_WEBPACK_PRODUCTION=1,
        that webpack.config.js honors it, and that a pinned production build emits
        an eval-free entry bundle (no eval-source-map devtool, no eval() calls).
        Also wired into .github/workflows/ci-frontend.yml.
    - name: stylelint
      command: yarn stylelint-linux
      cwd: .
    - name: http-binding-check
      command: ./scripts/ops/check_http_binding.sh
      cwd: .
      note: governance check — all complex mutation payloads use explicit source binding
  build:
    - name: backend-release
      command: dotnet build src/Bibliophilarr.sln --configuration Release -p:Platform=Posix
      cwd: .
      note: 0 warnings, 0 errors (~1m)
    - name: windows-desktop-project-model
      command: dotnet build src/NzbDrone/Bibliophilarr.csproj -p:Platform=Posix
      cwd: .
      note: cross-build portability gate — the net10.0-windows WinForms project model must restore/build on POSIX hosts (Rider/Coder failure mode regression check)
    - name: full-build
      command: ./build.sh --backend --frontend --packages --lint --framework net10.0 --runtime linux-x64
      cwd: .
      note: full pipeline (backend publish, test-asset packaging, yarn install, eslint+stylelint, webpack UI, linux-x64 package). Does NOT execute the dotnet test suite — test gating is via CI or the explicit test commands below.
  test:
    - name: common-tests
      command: dotnet test src/NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj --configuration Release -p:Platform=Posix
      cwd: .
      note: "656 tests: 621 passed, 35 skipped, 0 failed (2026-09-18). ProcessProviderFixture requires DOTNET_ROOT exported (or .NET on PATH) so the dummy helper app can start."
    - name: issue-256-regression-monitor-failsafe
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~MonitorNewBookServiceFixture"
      cwd: .
      note: "Issue #256 regression: MonitorNewBookService must not throw NotImplementedException for out-of-range NewItemMonitorTypes values (3, -1, 99); it logs a Warning and returns the safe no-monitor default. 6 tests (3 pre-existing + 3 new), 0 failed at head 75c21186."
    - name: issue-256-regression-import-no-silent-drop
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~ImportApprovedBooksFormatFixture"
      cwd: .
      note: "Issue #256 regression: import must not silently drop a book when the author's MonitorNewItems is out of range; the pipeline completes without throwing. 5 tests (4 pre-existing + 1 new), 0 failed at head 75c21186."
    - name: issue-256-regression-migration-048-clamp
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~clamp_monitor_new_items_to_valid_rangeFixture"
      cwd: .
      note: "Issue #256 data repair: migration 048 clamps out-of-range MonitorNewItems (AuthorFormatProfiles/Authors) to 0 and preserves valid values. 3 tests, 0 failed at head 75c21186."
