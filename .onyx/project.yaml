version: 1
name: bibliophilarr
canonical_repo: https://github.com/Swartdraak/Bibliophilarr
immutable_repo_id: 1159029625
default_branch: main
integration_branch: develop
promotion_path: [develop, staging, main]
human_gates: [stable-release, hotfix]
license: GPL-3.0
runtime_port: 8787

components:
  backend:
    path: src
    language: csharp
    solution: src/Bibliophilarr.sln
    framework: net10.0
    build_platform: Posix          # -p:Platform=Posix required on Linux/macOS
    nuget_config: src/NuGet.config # nuget.org only; pinned Servarr feed is 401 and NOT used
  frontend:
    path: frontend
    language: typescript
    bundler: webpack
    test_runner: jest
    package_manager: yarn@1.22.19
  host_app:
    path: src/NzbDrone.Console
    output: _output/net10.0/linux-x64/Bibliophilarr
    packaged: _artifacts/linux-x64/net10.0/Bibliophilarr/Bibliophilarr
  windows_desktop:
    path: src/NzbDrone
    framework: net10.0-windows
    note: WinForms shell; runnable on Windows only. On Linux/macOS the project model must still restore/build (EnableWindowsTargeting) — this is the Rider/Coder portability gate.

toolchain:
  dotnet: "10.0.x (verified 10.0.401; global.json pins 10.0.100, rollForward latestFeature)"
  node: "22.x per repo docs (verified locally on v20.20.2 — frontend gates pass on both)"
  yarn: "1.22.19"

commands:
  bootstrap:
    - name: yarn-install
      command: yarn install --frozen-lockfile
      cwd: .
    - name: dotnet-restore
      command: dotnet restore src/Bibliophilarr.sln -p:Platform=Posix
      cwd: .
  lint:
    - name: eslint
      command: yarn lint
      cwd: .
      note: 7 pre-existing warnings, 0 errors (no-negated-condition in frontend/src)
    - name: ui-build-mode-guard
      command: ./scripts/ops/check_ui_build_mode.sh
      cwd: .
      note: >
        Issue #252 regression guard (added in fix/issue-252-release-ui-eval-bundle):
        asserts the 'yarn build' script pins BIBLIOPHILARR_WEBPACK_PRODUCTION=1,
        that webpack.config.js honors it, and that a pinned production build emits
        an eval-free entry bundle (no eval-source-map devtool, no eval() calls).
        Also wired into .github/workflows/ci-frontend.yml.
    - name: stylelint
      command: yarn stylelint-linux
      cwd: .
    - name: http-binding-check
      command: ./scripts/ops/check_http_binding.sh
      cwd: .
      note: governance check — all complex mutation payloads use explicit source binding
  build:
    - name: backend-release
      command: dotnet build src/Bibliophilarr.sln --configuration Release -p:Platform=Posix
      cwd: .
      note: 0 warnings, 0 errors (~1m)
    - name: windows-desktop-project-model
      command: dotnet build src/NzbDrone/Bibliophilarr.csproj -p:Platform=Posix
      cwd: .
      note: cross-build portability gate — the net10.0-windows WinForms project model must restore/build on POSIX hosts (Rider/Coder failure mode regression check)
    - name: full-build
      command: ./build.sh --backend --frontend --packages --lint --framework net10.0 --runtime linux-x64
      cwd: .
      note: full pipeline (backend publish, test-asset packaging, yarn install, eslint+stylelint, webpack UI, linux-x64 package). Does NOT execute the dotnet test suite — test gating is via CI or the explicit test commands below.
  test:
    - name: common-tests
      command: dotnet test src/NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj --configuration Release -p:Platform=Posix
      cwd: .
      note: "656 tests: 621 passed, 35 skipped, 0 failed (2026-09-18). ProcessProviderFixture requires DOTNET_ROOT exported (or .NET on PATH) so the dummy helper app can start."
    - name: issue-256-regression-monitor-failsafe
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~MonitorNewBookServiceFixture"
      cwd: .
      note: "Issue #256 regression: MonitorNewBookService must not throw NotImplementedException for out-of-range NewItemMonitorTypes values (3, -1, 99); it logs a Warning and returns the safe no-monitor default. 6 tests (3 pre-existing + 3 new), 0 failed at head 75c21186."
    - name: issue-256-regression-import-no-silent-drop
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~ImportApprovedBooksFormatFixture"
      cwd: .
      note: "Issue #256 regression: import must not silently drop a book when the author's MonitorNewItems is out of range; the pipeline completes without throwing. 5 tests (4 pre-existing + 1 new), 0 failed at head 75c21186."
    - name: issue-256-regression-migration-048-clamp
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~clamp_monitor_new_items_to_valid_rangeFixture"
      cwd: .
      note: "Issue #256 data repair: migration 048 clamps out-of-range MonitorNewItems (AuthorFormatProfiles/Authors) to 0 and preserves valid values. 3 tests, 0 failed at head 75c21186."
    - name: rid-common-targeted
      command: dotnet test src/NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~RateLimitServiceFixture|FullyQualifiedName~ProcessProviderFixture"
      cwd: .
      note: "CI parity (ci-backend.yml rid-core-common-targeted): 18 tests: 16 passed, 2 skipped, 0 failed. RID-sensitive process/rate-limit fixtures only; HttpClientFixture deliberately excluded (covered by build-test lane)."
    - name: rid-core-targeted
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~AddAuthorFixture|FullyQualifiedName~MetadataProviderOrchestratorFixture|FullyQualifiedName~OpenLibrarySearchProxyFixture"
      cwd: .
      note: "CI parity (ci-backend.yml rid-core-common-targeted): re-verified 2026-10-12 at 8e381ed8c6 - 25 tests, 25 passed, 0 failed (fixture count grown since the 2026-09-18 note of 20). OpenLibrarySearchProxyFixture replaced the stale OpenLibraryIsbnAsinLookupFixture reference from the main band."
    - name: metadata-core-fixtures
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release --no-restore -p:Platform=Posix --filter "FullyQualifiedName~MetadataProviderOrchestratorFixture|FullyQualifiedName~ImportListSyncServiceFixture|FullyQualifiedName~OpenLibraryClientResilienceFixture|FullyQualifiedName~InventaireClientResilienceFixture|FullyQualifiedName~OpenLibraryIdBackfillServiceFixture"
      cwd: .
      note: "CI parity (ci-backend.yml metadata-provider-fixtures): re-verified 2026-10-12 at 8e381ed8c6 - 32 tests, 32 passed, 0 failed (fixture count grown since the 2026-09-18 note of 27)."
    - name: metadata-api-fixtures
      command: dotnet test src/NzbDrone.Api.Test/Bibliophilarr.Api.Test.csproj --configuration Release --no-restore -p:Platform=Posix --filter "FullyQualifiedName~MetadataProvidersControllerFixture|FullyQualifiedName~MetadataProviderConfigResourceMapperFixture"
      cwd: .
      note: "CI parity (ci-backend.yml metadata-provider-fixtures): 4 tests, 4 passed, 0 failed."
    - name: issue-279-regression-add-book-null-addoptions
      command: dotnet test src/NzbDrone.Api.Test/Bibliophilarr.Api.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~Issue279"
      cwd: .
      note: "Issue #279 regression: BookResourceMapper.ToModel must substitute a fresh AddBookOptions when the client omits the optional addOptions field, so AddBookService.AddBook's 'book.AddOptions.AddType = Manual' (AddBookService.cs:63) never throws NullReferenceException (500 instead of 201). 3 tests (null-addOptions -> non-null default; omitted-addOptions+editions payload maps cleanly; client-provided addOptions preserved), 0 failed at head 8d2281e4c5 (work branch fix/issue-279-add-book-500-null-addoptions, run t_f1ae9028). Pinned by BookResourceMapperIssue279Fixture."
    - name: issue-275-regression-manualimport-null-edition-mapping
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~ImportDecisionMaker"
      cwd: .
      note: "Issue #275 regression: the manual-import scan path (GET /api/v1/manualimport) must not leave the discovered item's book/edition mapping NULL -> permanent 'Couldn't find similar book' rejection (ImportDecisionMaker.GetDecision null-Edition branch). When identification leaves a release without a catalogue Edition, ImportDecisionMaker now performs a bounded direct catalogue lookup (IMetadataProviderOrchestrator.SearchForNewBook) from the file's own book/author metadata and adopts the best candidate edition; genuinely-unresolvable items keep the original permanent rejection. Pinned by ImportDecisionMakerIssue275Fixture (5 tests: match-on-null-edition; keep-rejection-no-metadata; keep-rejection-lookup-empty; keep-rejection-lookup-throws; no-throw-no-metadata) plus the 14 pre-existing ImportDecisionMakerFixture tests. RE-VERIFIED 2026-10-16 on a FRESH linux-x64 RID build at the repaired head (work branch fix/issue-275-manualimport-null-edition-mapping, run t_7bdf990f): this filter yields 19 total (14 pre-existing + 5 new), 19 passed / 0 failed / 0 skipped. PITFALL: the linux-x64 RID test assembly only rebuilds with '-r linux-x64'; a stale RID DLL that predates the new fixture makes this filter silently report only the 14 pre-existing tests (a false '14/14'), so ALWAYS rebuild the RID assembly fresh at the exact head and confirm the fixture is present in the DLL (strings | grep -c ImportDecisionMakerIssue275Fixture == 1) before trusting the count."
    - name: issue-272-regression-author-refresh-delete-local
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 --filter "FullyQualifiedName~RefreshAuthorServiceFixture"
      cwd: .
      note: "Issue #272 regression: a locally created author (synthetic/unmapped foreign id, AuthorMetadataId == 0) persisted via POST /api/v1/author must survive the post-create background refresh — RefreshAuthorService.ShouldDelete returns false for AuthorMetadataId <= 0 so the expected not-found is not treated as a provider-removal signal; provider-sourced authors (AuthorMetadataId > 0) keep the documented provider-removed deletion behavior (#204/#209). Pinned by three new tests in RefreshAuthorServiceFixture: should_not_delete_newly_created_local_author_when_foreign_id_unresolvable_and_no_files (single RefreshAuthorCommand), should_not_delete_local_author_on_bulk_refresh_when_foreign_id_unresolvable_and_no_files (BulkRefreshAuthorCommand), and should_still_delete_provider_sourced_author_when_remote_removed_and_no_files (no-regression guard). RE-VERIFIED 2026-10-17 at head 42d0de9e (work branch fix/issue-272-author-refresh-delete, run t_60662025): 16 total (13 pre-existing + 3 new); the 3 new + 11 pre-existing pass. PRE-EXISTING: 2 pre-existing not-found tests (should_log_error_and_delete_if_musicbrainz_id_not_found_and_author_has_no_files, should_log_error_but_not_delete_if_musicbrainz_id_not_found_and_author_has_files) fail in this isolated environment due to NLog async-delivery timing of the ExceptionVerification target (the fixture's ExpectedErrors/ExpectedWarns counts race with log delivery) — they fail identically on the BASE head d0f6b0e0 (see baseline.json) and are NOT caused by this change; RefreshAuthorServiceFixture is not a CI-required lane (ci-backend.yml runs targeted filters only), so these pre-existing failures do not block the PR."
    - name: issue-296-regression-command-unknown-name
      command: dotnet test src/NzbDrone.Api.Test/Bibliophilarr.Api.Test.csproj --configuration Release -p:Platform=Posix --filter "FullyQualifiedName~CommandControllerUnknownNameIssue296Fixture"
      cwd: .
      note: "Issue #296 regression: POST /api/v1/command with a command name matching no registered Command implementation must return 400 (BadRequest), never 500. Before the fix, CommandController.StartCommand used Enumerable.Single, which throws InvalidOperationException when zero implementations match; BibliophilarrErrorPipeline maps that to HttpStatusCode.InternalServerError and logs it at Fatal, producing a 500 for a benign client-input condition. The endpoint now resolves the type with FirstOrDefault and throws a 400 BadRequestException when the name is unknown, and reads the raw request body up front (no behavior change for the error path). Pinned by CommandControllerUnknownNameIssue296Fixture (5 tests: 3 unknown-name cases -> 400 ApiException not 500/InvalidOperationException; ApplicationUpdateCommand guard preserved -> 400 with disabled message; resolvable name not rejected by the guard -> 201 CreatedAtActionResult). RE-VERIFIED 2026-10-18 at head 816bd8d3e8 (work branch fix/issue-296-command-unknown-name-4xx, run t_56e08eff): RED 4-failed at base (3 unknown-name -> InvalidOperationException @ CommandController.cs:55; 1 resolvable blocked at Request.Body) / GREEN 5-passed post-fix; full NzbDrone.Api.Test suite 80/80; full solution Release build 0 warn/0 err. The durable end-to-end HTTP acceptance (unknown-name -> 4xx over the wire) is exercised in the application-test stage; the existing NzbDrone.Integration.Test CommandFixture is [Ignore]d and requires Postgres, so this unit-level fixture is the CI-parity guard."
    - name: issue-307-regression-manualimport-null-edition
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix -r linux-x64 -p:SixLaborsLicenseFile=<sixlabors.lic> --filter "FullyQualifiedName~ManualImportServiceExecute"
      cwd: .
      note: "Issue #307 regression (complement of the #295 fix at 1f158eede): POST /api/v1/manualimport (update) with a valid BookId and null ForeignEditionId must NOT strand the imported file unmapped (BookFile.EditionId=0). ManualImportService.Execute now defaults the edition to the book's MONITORED edition (mirroring the event-path fallback at ImportApprovedBooks.cs:359) BEFORE the #295 rejection guard, so the file is persisted mapped (EditionId>0); a book with NO monitored edition is still explicitly rejected (honest failure, #295 semantics preserved). Pinned by ManualImportServiceExecuteIssue307Fixture (3 tests: null-foreignEditionId + monitored edition -> decision APPROVED with Edition.Id>0; null-foreignEditionId + no monitored edition -> decision REJECTED; unresolvable named edition + no monitored edition -> decision REJECTED) plus the 2 pre-existing ManualImportServiceExecuteFixture (#295) tests. RE-VERIFIED 2026-10-20 at develop 1f158eede (base) with work branch fix/issue-307-manualimport-default-monitored-edition (run t_d604af7f): the default-to-monitored-edition test RED-fails at base (decision rejected instead of approved) / GREEN post-fix; full ManualImportServiceExecute* filter 5/5 post-fix; rid-core-targeted 25/25, issue-275 19/19, issue-256 16/16; full solution Release build 0 warn/0 err. The durable end-to-end HTTP acceptance (mapped BookFile row + per-book view) is exercised in the application-test stage; this unit-level fixture is the CI-parity guard. Secondary defect noted in issue #307 (zero-byte/corrupt media persisting BookFile rows, AC4) is a distinct defect with no media-integrity validation layer in this repo and is NOT fixed by this change; it is reported as a follow-up issue."
    - name: issue-309-regression-coldboot-apikey-stale-cache
      command: dotnet test src/NzbDrone.Api.Test/Bibliophilarr.Api.Test.csproj --configuration Release -p:Platform=Posix -p:SixLaborsLicenseFile=<sixlabors.lic> --filter "FullyQualifiedName~ApiKeyAuthenticationHandlerFixture"
      cwd: .
      note: "Issue #309 regression (cold-boot API-key authentication): a freshly-booted instance whose config.xml holds a persisted 32-char ApiKey must accept X-Api-Key=<that key> with 200 during the readiness window. Root cause: ApiKeyAuthenticationHandler (src/Bibliophilarr.Http/Authentication/ApiKeyAuthenticationHandler.cs) captured config.ApiKey exactly once in its constructor (private readonly string _apiKey = config.ApiKey) and compared every request against that stale value. On a cold boot the value captured at construction can be a pre-finalization key that differs from the key ultimately persisted to config.xml during startup (ConfigFileProvider.ApiKey generates/persists on first access); because the cache was never invalidated, the persisted key 401'd for the entire boot until a restart. Fix: the handler now reads _config.ApiKey per request in HandleAuthenticateAsync (no construction-time cache) and treats a blank configured key as non-authenticating. Pinned by ApiKeyAuthenticationHandlerFixture (5 tests: persisted key authenticates after cold-boot finalization — RED at base; wrong key rejected; missing key rejected; blank configured key rejects all; Bearer Authorization header still authenticates). RE-VERIFIED 2026-10-20 at develop 3374451bd (base) with work branch fix/issue-309-coldboot-apikey-stale-cache (run t_00c99e08): RED 1-failed/4-passed at base (cold-boot test) / GREEN 5/5 post-fix; full NzbDrone.Api.Test suite 89/89; full solution Release build 0 warn/0 err (CI parity, analyzers ON). The durable end-to-end cold-boot HTTP acceptance (persisted key 200 over the wire on a fresh data dir) is exercised in the application-test stage; this unit-level fixture is the CI-parity guard."
    - name: core-tests
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix
      cwd: .
      note: "PRE-EXISTING FAILURES: 2767 total -> 2600 passed, 108 failed, 59 skipped in isolated env 2026-09-18 (net10.0 band). Deterministic. Concentrated in DownloadClient fixtures (93 of 108) plus MediaFiles/Profiles/Books/Datastore. CI does NOT run the full Core suite — it runs the targeted filters above (all green). NOT caused by onboarding. See baseline.json + logs/develop-15-core-full.log."
    - name: frontend-tests
      command: yarn test:frontend
      cwd: .
      note: "jest --runInBand: 47 tests / 13 suites, 0 failures (2026-09-18)."
  runtime:
    start: |
      ./build.sh --backend --frontend --packages --lint --framework net10.0 --runtime linux-x64
      cp -r _output/UI _output/net10.0/linux-x64/UI
      ./_output/net10.0/linux-x64/Bibliophilarr /data=<data-dir> /nobrowser /nosingleinstancecheck
    package_start: |
      ./_artifacts/linux-x64/net10.0/Bibliophilarr/Bibliophilarr /data=<data-dir> /nobrowser /nosingleinstancecheck
    health:
      - command: curl -sS http://127.0.0.1:8787/ping
        expect: "200 { \"status\": \"OK\" }"
      - command: curl -sS "http://127.0.0.1:8787/api/v1/system/status?apikey=<ApiKey>"
        expect: "200 JSON (apiKey read from <data-dir>/config.xml; API requires the key)"
    note: >
      Data dir must be a fresh writable path. The app generates ApiKey and
      config.xml on first start. /ping is unauthenticated; /api/v1/* requires
      the apikey query param. BIBLIOPHILARR_SERVICES_URL and
      BIBLIOPHILARR_HARDCOVER_API_TOKEN are optional env overrides.
      Verified on the _output tree (app 10.0.0.15583) and on the packaged
      _artifacts tree (no manual UI copy needed).
  deployment:
    isolation: testing-only
    docker_image: "ghcr.io/swartdraak/bibliophilarr (release images; local build: docker build -t bibliophilarr:local .)"
    production_deployment: PROHIBITED for autonomous work — isolated testing / semi-production validation only, with synthetic data, scoped access, and cleanup.

governance:
  documentation:
    canonical:
      - README.md
      - AGENTS.md            # develop-only: repository-wide agent operating contract
      - ARCHITECTURE.md
      - BRANCHING.md         # authoritative branch lifecycle (develop/staging/main)
      - PROJECT_STATUS.md
      - ROADMAP.md
      - MIGRATION_PLAN.md
      - QUICKSTART.md        # net10.0 canonical commands
      - CONTRIBUTING.md      # PR metadata + contribution flow
      - SECURITY.md
      - CHANGELOG.md
    operations_runbooks: docs/operations/
  branching:
    lanes: [develop, staging, main]
    integration: develop
    patterns: [feat/*, feature/*, fix/*, docs/*, chore/*, refactor/*, security/*, perf/*, test/*, release-fix/*, hotfix/*]
    human_gates: [stable-release, hotfix]
    docs: [BRANCHING.md, docs/operations/BRANCH_STRATEGY.md, docs/operations/BRANCH_PROTECTION_RUNBOOK.md]
  ci:
    backend: .github/workflows/ci-backend.yml          # build-test, rid-core-common-targeted, metadata-provider-fixtures, metadata-diagnostics-integration
    frontend: .github/workflows/ci-frontend.yml        # yarn install/test/lint/build
    cross_build_portability: .github/workflows/cross-build-portability.yml  # Linux/Windows/macOS lanes + rid_mapping (X64->x64, Arm64->arm64), functional since PR #234 (main) and present on develop
    other: [docs-validation.yml, lint-workflows.yml (actionlint), release.yml, docker-image.yml, npm-publish.yml, required-check-emission-smoke.yml, staging-smoke-metadata-telemetry.yml, validate-release-version.yml, branch-policy-audit.yml, operational-drift-check.yml]

