# Onyx project contract — Swartdraak/Bibliophilarr
# Authoritative executable contract for autonomous work on this repository.
# Commands below were verified in an isolated Docker audit environment
# (Debian 13, .NET SDK 8.0.416, Node v20.20.2, Yarn 1.22.19) on
# 2026-09-17 at base SHA b1f36b0ee417cda0b0840b60ac505ae7ad5b7aca.
# See baseline.json (workspace root) for per-command evidence and
# logs/ for raw output. Do not store credentials or secrets here.

version: 1
name: bibliophilarr
canonical_repo: https://github.com/Swartdraak/Bibliophilarr
immutable_repo_id: 1159029625
default_branch: main
license: GPL-3.0
runtime_port: 8787

components:
  backend:
    path: src
    language: csharp
    solution: src/Bibliophilarr.sln
    framework: net8.0
    build_platform: Posix          # -p:Platform=Posix required on Linux
    nuget_config: src/NuGet.config # nuget.org only; pinned feed is 401 and NOT used
  frontend:
    path: frontend
    language: typescript
    bundler: webpack
    test_runner: jest
    package_manager: yarn@1.22.19
  host_app:
    path: src/NzbDrone.Console
    output: _output/net8.0/linux-x64/Bibliophilarr
    packaged: _artifacts/linux-x64/net8.0/Bibliophilarr/Bibliophilarr

toolchain:
  dotnet: "8.0.x (verified 8.0.416; global.json pins 8.0.100, rollForward latestFeature)"
  node: "22.x per CI/volta (verified locally on v20.20.2 — frontend gates pass on both)"
  yarn: "1.22.19"

commands:
  bootstrap:
    - name: yarn-install
      command: yarn install --frozen-lockfile
      cwd: .
    - name: dotnet-restore
      command: dotnet restore src/Bibliophilarr.sln -p:Platform=Posix
      cwd: .
  lint:
    - name: eslint
      command: yarn lint
      cwd: .
      note: 7 pre-existing warnings, 0 errors (no-negated-condition in frontend/src)
    - name: stylelint
      command: yarn stylelint-linux
      cwd: .
    - name: http-binding-check
      command: ./scripts/ops/check_http_binding.sh
      cwd: .
      note: governance check — all complex mutation payloads use explicit source binding
  build:
    - name: backend-release
      command: dotnet build src/Bibliophilarr.sln --configuration Release -p:Platform=Posix
      cwd: .
      note: 0 warnings, 0 errors (~2m20s)
    - name: full-build
      command: ./build.sh --backend --frontend --packages --lint --framework net8.0 --runtime linux-x64
      cwd: .
      note: full pipeline (backend publish, test-asset packaging, yarn install, eslint+stylelint, webpack UI, package). Does NOT execute the dotnet test suite -- test gating is via CI or the explicit test commands above.
  test:
    - name: common-tests
      command: dotnet test src/NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj --configuration Release -p:Platform=Posix
      cwd: .
      note: "651 tests: 616 passed, 35 skipped, 0 failed. ProcessProviderFixture requires DOTNET_ROOT exported (or .NET on PATH) so the dummy helper app can start."
    - name: core-tests
      command: dotnet test src/NzbDrone.Core.Test/Bibliophilarr.Core.Test.csproj --configuration Release -p:Platform=Posix
      cwd: .
      note: "PRE-EXISTING FAILURES: 2765 total -> 2603 passed, 103 failed, 59 skipped in isolated env 2026-09-17. Deterministic in isolation (subset re-run also fails). Concentrated in DownloadClient tests (QBittorrent/NzbVortex/Sabnzbd/Nzbget/Hadouken/RTorrent/Transmission/DownloadStation) plus Books/MediaFiles/Profiles. See baseline.json + logs/test-core.log. NOT caused by onboarding."
    - name: frontend-tests
      command: yarn test:frontend
      cwd: .
      note: "jest, --runInBand. PASS: 47 tests / 13 suites, 0 failures (2026-09-17). see logs/test-frontend.log"
  runtime:
    start: |
      ./build.sh --backend --frontend --packages --lint --framework net8.0 --runtime linux-x64
      cp -r _output/UI _output/net8.0/linux-x64/UI
      ./_output/net8.0/linux-x64/Bibliophilarr /data=<data-dir> /nobrowser /nosingleinstancecheck
    health:
      - command: curl -sS http://127.0.0.1:8787/ping
        expect: "200 { \"status\": \"OK\" }"
      - command: curl -sS "http://127.0.0.1:8787/api/v1/system/status?apikey=<ApiKey>"
        expect: "200 JSON (apiKey read from <data-dir>/config.xml; API requires the key)"
    note: >
      Data dir must be a fresh writable path. The app generates ApiKey and
      config.xml on first start. /ping is unauthenticated; /api/v1/* requires
      the apikey query param. BIBLIOPHILARR_SERVICES_URL and
      BIBLIOPHILARR_HARDCOVER_API_TOKEN are optional env overrides.
  deployment:
    isolation: testing-only
    docker_image: "ghcr.io/swartdraak/bibliophilarr (release images; local build: docker build -t bibliophilarr:local .)"
    production_deployment: PROHIBITED for autonomous work — isolated testing / semi-production validation only, with synthetic data, scoped access, and cleanup.

governance:
  documentation:
    canonical:
      - README.md
      - PROJECT_STATUS.md
      - ROADMAP.md
      - MIGRATION_PLAN.md
      - QUICKSTART.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
    operations_runbooks: docs/operations/
  branching:
    lanes: [main, staging, develop]   # see docs/operations/BRANCH_PROTECTION_RUNBOOK.md
  ci:
    backend: .github/workflows/ci-backend.yml      # dotnet build/test, RID-targeted + metadata provider fixtures
    frontend: .github/workflows/ci-frontend.yml    # yarn install/test/lint/build
    other: [docs-validation.yml, lint-workflows.yml, release.yml, docker-image.yml, npm-publish.yml]

baseline_evidence:
  file: ../baseline.json
  logs: ../logs/
  verified_at: 2026-09-17
  base_sha: b1f36b0ee417cda0b0840b60ac505ae7ad5b7aca

skipped_integrations:
  - name: docker-image-build
    reason: Docker daemon not available in the audit container; image build/release pipeline (Dockerfile, docker-image.yml, docker-compose.*) verified by inspection only.
  - name: rid-core-common-targeted-cifilters
    reason: RID-targeted fixtures (HttpClient/RateLimit/ProcessProvider, AddAuthor/MetadataProviderOrchestrator/OpenLibraryIsbnAsinLookup) were not re-run as isolated filter sets beyond the full test suites; full CI on GitHub Actions remains the authority.
  - name: postgres-integration
    reason: postgres.runsettings present; no Postgres server available in audit environment.
  - name: browser-e2e
    reason: no browser/E2E harness in repo; UI verified via build + HTTP smoke only.
  - name: external-metadata-providers
    reason: live provider calls (Hardcover, OpenLibrary, Inventaire) require network/credentials; unit fixtures only, per CI design.

pre_existing_faults:
  - name: core-test-suite-failures
    severity: medium
    description: >
      Bibliophilarr.Core.Test has 103 deterministic pre-existing failures out of
      2765 (2603 passed, 59 skipped) in the isolated audit environment
      (2026-09-17, base b1f36b0ee). A filtered subset (QualityProfileService,
      MetadataProfileService, BookServiceBooksWithoutFilesFormat) re-run in
      isolation also fails (6/21), confirming this is real test/code divergence,
      not a test-ordering or environment artifact. Failures concentrate in
      DownloadClient fixtures (QBittorrent 59, NzbVortex 12, Sabnzbd 8, Hadouken
      5, Nzbget 3, RTorrent 2, Transmission, DownloadStation) and in
      Books/MediaFiles/Profiles fixtures. Error classes:
      "Sequence contains more than one element" (68),
      "Expected boolean to be True, but found False" (14),
      "Sequence contains no elements" (7), NullReferenceException (4),
      Moq.MockException unmet expectations (e.g. BooksWithoutFiles never
      invoked), and InUse exceptions not thrown. This is a pre-existing
      condition of the fork's test suite, NOT introduced by onboarding; the
      repo's own CI (ci-backend.yml) runs targeted fixture filters rather than
      the full Core suite. Recorded for transparency; out of scope to fix here.
      Evidence: logs/test-core.log, logs/test-core-subset.log.
  - name: pinned-nuget-feed-401
    severity: low
    description: >
      QUICKSTART.md states src/NuGet.config "includes the Servarr package feeds
      required for FluentMigrator, SQLite, Mono.Posix", but the checked-in
      NuGet.config contains only nuget.org. The pinned Azure DevOps feed
      (pkgs.dev.azure.com/Servarr/v3) returns 401 anonymously, so restore
      actually resolves everything from nuget.org. Documentation drift, not a
      build break — restore and build succeed — but the docs overstate the
      feed dependency.
  - name: eslint-negated-condition-warnings
    severity: low
    description: >
      yarn lint reports 7 pre-existing no-negated-condition warnings
      (Author/Details/BookRow.js, Book/Details/BookDetailsHeader.js,
      Book/Index/Table/BookIndexRow.js, System/Tasks/Scheduled/ScheduledTaskRow.js).
      0 errors; lint gate passes.
  - name: processprovider-needs-dotnet-root
    severity: low
    description: >
      ProcessProviderFixture tests (3) spawn the Bibliophilarr.Test.Dummy app
      host, which requires .NET to be discoverable (DOTNET_ROOT or PATH).
      In CI (actions/setup-dotnet) this is satisfied; in isolated containers
      with a non-standard dotnet install they fail with
      "Failed to resolve libhostfxr.so" unless DOTNET_ROOT is exported.
      Environment setup gap, not a code fault: with DOTNET_ROOT set,
      651/651 (616 passed, 35 skipped) pass.
