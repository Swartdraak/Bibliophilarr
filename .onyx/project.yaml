      note: "Issue #99 regression (frontend toolchain modernization, Prettier 2.x -> 3.x, epic #96): pins the coordinated Prettier 3 bump. The historical dependabot slice (PR #56, prettier 2.8.8 -> 3.x) was closed UNMERGED, so the repo kept prettier 2.8.8 with a Prettier-2-era ESLint toolchain. This run bumps prettier 2.8.8 -> 3.8.1, eslint-config-prettier 8.10.2 -> 9.1.0, eslint-plugin-prettier 4.2.5 -> 5.5.5 (the plugin bump is REQUIRED: 4.x calls prettier.resolveConfig.sync, which Prettier 3 removed), and reformats frontend/src/App/State/{AuthorsAppState,SettingsAppState}.ts to the Prettier 3 default (whitespace-only). 6 tests (frontend/src/Issue99/prettierToolchainModernization.test.js): (1) package.json pins a 3.x prettier; (2) package.json pins the prettier-3-compatible eslint-config-prettier 9.x + eslint-plugin-prettier 5.x lines; (3) the actually-installed prettier package is 3.x; (4) the installed prettier binary (node_modules/.bin/prettier, invoked as a subprocess — the real toolchain, not a substitute) reports 3.x; (5) `prettier --check` on the two reformatted state files exits 0 (idempotent — the committed bytes ARE the Prettier 3 output); (6) the installed prettier re-emits a TS snippet honoring the repo .prettierrc singleQuote convention. The CLI is invoked (not `require('prettier')` in-proc) because Prettier 3's CJS entry re-exports an ESM build via dynamic import(), which jest 30's CJS transform cannot run without --experimental-vm-modules. RE-VERIFIED 2026-10-31 in-container (task t_6f0386ae, run 3367) at base develop 761424f2: GREEN 6/6; full frontend suite 74/74 / 18 suites (68 baseline + 6 new); yarn lint 0 errors / 8 pre-existing warnings; both ops guards PASS; stylelint PASS; full production webpack build compiled successfully. No src/frontend/lib/app runtime file changed (no production_coverage binding). Historical #99 mapping: #56 Prettier DONE (this run); #55 rimraf, #54 webpack-cli, #53 postcss-mixins, #52 Font Awesome REMAINING (genuine future work). Contributes to #99 and epic #96."
