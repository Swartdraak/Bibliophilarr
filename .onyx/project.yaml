  file: ../baseline.json
  logs: ../logs-t_d604af7f/
  verified_at: 2026-10-20
  base_sha: 1f158eedefb245c4d2bd260a042a90d1e108ebb2
  head_sha: 9013f8fdc049c732884e34625a9b2645df9c437d
  # Issue #307 development run (t_d604af7f, 2026-10-20): work branch
  # fix/issue-307-manualimport-default-monitored-edition from live develop
  # 1f158eede (merge of PR #306, the #295 fix). Implemented the
  # default-to-monitored-edition fallback in ManualImportService.Execute so a
  # manual-import update with a valid BookId and null ForeignEditionId persists
  # the BookFile mapped to the book's monitored edition (EditionId > 0) instead
  # of being rejected by the #295 guard (which had made the issue-#307 shape
  # fail honestly but still not satisfy the issue's acceptance criteria) or
  # (at older heads) persisted unmapped at EditionId=0. Three regression tests
  # added to ManualImportServiceExecuteIssue307Fixture; the #295 semantics are
  # pinned (no monitored edition -> still rejected). Verified at the fixed head:
  # ManualImportServiceExecute* 5/5 (RED 1-fail at base for the new default test),
  # rid-core-targeted 25/25, issue-275 19/19, issue-256 16/16, full solution
  # Release build 0 warn/0 err. PRE-EXISTING: 108 deterministic Core-suite
  # failures in the isolated env (unchanged; CI runs targeted filters only).
  # The issue-#307 secondary defect (AC4: zero-byte/corrupt media persisting
  # BookFile rows) is NOT fixed here — it has no validation layer in this repo
  # and is a distinct defect; reported as a follow-up issue. Prior verified runs
  # remain the record: issue #296 @ 816bd8d3e8 (t_56e08eff), issue #272 @
  # 42d0de9e (t_60662025), issue #275 repair (t_7bdf990f), issue #279 @
  # 8d2281e4c5 (t_f1ae9028), issue #256 @ 75c21186 (t_5daa7896), PR #243 @
  # 949a43a160 (t_e4ea787), PR #225 @ 1f37119280 (t_efb34b16), 2026-09-18
  # baseline @ d21d1361c. Hosted exact-head CI is the merge gate.
  lane: develop (net10.0 band)
  note: >
    Issue #307 development run (t_d604af7f, 2026-10-20). The defect (regression of
    the #295 fix at 1f158eede): POST /api/v1/manualimport (update) with a valid
    BookId and null ForeignEditionId left the import decision with Edition == null,
    so the #295 guard (ManualImportService.cs) rejected it and the file was never
    persisted mapped — while at older heads the same shape persisted an unmapped
    BookFile at EditionId=0. The fix defaults the edition to the book's monitored
    edition (book.Editions.Value.First(x => x.Monitored), mirroring the event-path
    fallback at ImportApprovedBooks.cs:359) BEFORE the #295 guard, so the BookFile
    is persisted mapped (EditionId > 0); when the book has no monitored edition the
    import is still explicitly rejected (honest failure, #295 semantics preserved).
    Three regression tests added to ManualImportServiceExecuteIssue307Fixture
    (default-to-monitored-edition approved; no-monitored-edition rejected;
    unresolvable-named-edition rejected). Verified at the fixed head:
    ManualImportServiceExecute* 5/5 (the default test RED-fails at base),
    rid-core-targeted 25/25, issue-275 19/19, issue-256 16/16, full solution
    Release build 0 warn/0 err. PRE-EXISTING: 108 deterministic Core-suite
    failures in the isolated env (unchanged; CI runs targeted filters only).
    The issue-#307 secondary defect (AC4: zero-byte/corrupt media persisting
    BookFile rows) is NOT fixed here — no media-integrity validation layer exists
    in this repo and it is a distinct defect; reported as a follow-up issue.
    Hosted exact-head CI is the merge gate.

