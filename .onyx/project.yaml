    - name: issue-103-regression-nuget-audit-nonfatal-gate
      command: dotnet test src/NzbDrone.Common.Test/Bibliophilarr.Common.Test.csproj --configuration Release -p:Platform=Posix --filter "FullyQualifiedName~NuGetAuditModeIssue103"
      cwd: .
      note: "NET10-03 (#103, epic #96 .NET 8 -> .NET 10 LTS) NuGet compatibility review: the .NET 10 SDK enables NuGetAudit by default (audit level = high), emitting NU1901-NU1904 vulnerable-package warnings at restore. With TreatWarningsAsErrors=true (Directory.Build.props) ANY of those audit warnings escalates to a hard restore/build error that aborts the whole restore, so a single NEW advisory (direct OR transitive) red-lines the entire solution and stops every PR/CI lane (the documented Oct-2026 'develop went red' trap: SixLabors/ImageSharp 3.1.11, System.Security.Cryptography.Pkcs). Fix: src/Directory.Build.props now sets <NuGetAuditMode>direct</NuGetAuditMode> - the audit is narrowed to DIRECT package references; transitive-only advisories degrade to a visible, triageable warning while direct-reference advisories still surface as NU19xx and still gate the build (TreatWarningsAsErrors stays true). The repo keeps the known-vulnerable transitive pins (System.Security.Cryptography.Pkcs 10.0.13, System.Drawing.Common 9.0.0, SixLabors.ImageSharp 4.1.2) in Directory.Packages.props so residual transitive risk is explicitly tracked. Pinned by NuGetAuditModeIssue103Fixture (3 tests: NuGetAuditMode=direct declared exactly once and not all/default; TreatWarningsAsErrors remains true; a single NuGetAuditMode occurrence so a later override cannot silently win in MSBuild). RE-VERIFIED 2026-10-31 at develop base 7b830538 (work branch fix/issue-103-nuget-audit-nonfatal-gate, run 3278): RED 2/3 failed when the gate line is removed (negative test proves the guard is not vacuous) / GREEN 3/3 post-fix; full-sln restore EXIT 0 + full Release build 0 warn/0 err with NuGetAuditMode=direct active (behaviorally inert at the current head, zero NU19xx, no dependency churn). No JS/TS runtime files under src/frontend/lib/app changed (no production_coverage binding required). Contributes to #103 and epic #96."
