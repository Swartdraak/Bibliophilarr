    - name: issue-329-regression-authed-spa-blank-shell
      command: yarn test:frontend --testPathPattern frontend/src/index.test.js
      cwd: .
      note: "Issue #329 regression (authed SPA routes render blank app shell under Forms auth): pins the frontend boot contract in index.ts. Before the fix, index.ts fetched /initialize.json via a top-level await with no error handling; a 401 (UiAuthenticationMiddleware Forms-challenged /initialize.json as a UI-shell GET) or any failure threw an unhandled rejection before React mounted, leaving every authed route (/library, /search, /settings) as a byte-identical blank app shell. The fix extracts loadInitializeConfig() with a response.ok gate + try/catch, wraps bootstrap() in try/catch with a visible error on #root, and exports the moduleReady promise. 5 tests: (1) boots end-to-end on 200+JSON — window.Bibliophilarr populated, app mounted; (2) does NOT blank-shell on the #329 signature 401+empty body; (3) does NOT blank-shell when the boot fetch throws (network failure); (4) does NOT blank-shell on a non-JSON body; (5) pins the guarded-fetch integration contract in index.ts (static source checks: response.ok gate before response.json()). RED 5/5 on original index.ts (top-level await SyntaxError under jest CJS transform + missing response.ok gate) / GREEN 5/5 post-fix. RE-VERIFIED 2026-10-24 in-container (task t_1445b5f4, run 2406): logs-t_1445b5f4/jest-issue329-redgreen-r2421.log. Companion backend regression: InitializeJsonIssue329Fixture (2 integration tests) via the ci-backend.yml metadata-diagnostics-integration filter (Debug): anonymous GET /initialize.json -> 200 + persisted apiKey + urlBase, no Location challenge; apiKey matches persisted key per request. GREEN 2/2 post-fix (logs-t_1445b5f4/integration-issue329-r2421.log). PRE-EXISTING (not a #329 regression): 3 HostConfigAuthorizationFixture failures in the same CI-parity filter (malformed-Basic-auth expected 401 got 200; malformed-PUT expected 401 got RequestUriTooLong; anon-GET expected 401 got 200) — fail identically at BASE c19a261c (logs-t_1445b5f4/hostcfg-base-r2421.log, BASE_HOSTCFG_EXIT=1, 3 failed/2