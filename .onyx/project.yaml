    - name: issue-309-regression-coldboot-apikey-stale-cache
      command: dotnet test src/NzbDrone.Api.Test/Bibliophilarr.Api.Test.csproj --configuration Release -p:Platform=Posix -p:SixLaborsLicenseFile=<sixlabors.lic> --filter "FullyQualifiedName~ApiKeyAuthenticationHandlerFixture"
      cwd: .
      note: "Issue #309 regression (cold-boot API-key authentication): a freshly-booted instance whose config.xml holds a persisted 32-char ApiKey must accept X-Api-Key=<that key> with 200 during the readiness window. Root cause: ApiKeyAuthenticationHandler (src/Bibliophilarr.Http/Authentication/ApiKeyAuthenticationHandler.cs) captured config.ApiKey exactly once in its constructor (private readonly string _apiKey = config.ApiKey) and compared every request against that stale value. On a cold boot the value captured at construction can be a pre-finalization key that differs from the key ultimately persisted to config.xml during startup (ConfigFileProvider.ApiKey generates/persists on first access); because the cache was never invalidated, the persisted key 401'd for the entire boot until a restart. Fix: the handler now reads _config.ApiKey per request in HandleAuthenticateAsync (no construction-time cache) and treats a blank configured key as non-authenticating. Pinned by ApiKeyAuthenticationHandlerFixture (5 tests: persisted key authenticates after cold-boot finalization — RED at base; wrong key rejected; missing key rejected; blank configured key rejects all; Bearer Authorization header still authenticates). RE-VERIFIED 2026-10-20 at develop 3374451bd (base) with work branch fix/issue-309-coldboot-apikey-stale-cache (run t_00c99e08): RED 1-failed/4-passed at base (cold-boot test) / GREEN 5/5 post-fix; full NzbDrone.Api.Test suite 89/89; full solution Release build 0 warn/0 err (CI parity, analyzers ON). The durable end-to-end cold-boot HTTP acceptance (persisted key 200 over the wire on a fresh data dir) is exercised in the application-test stage; this unit-level fixture is the CI-parity guard."
    - name: issue-316-regression-ping-anonymous-json
      command: dotnet test src/NzbDrone.Api.Test/Bibliophilarr.Api.Test.csproj --configuration Release -p:Platform=Posix -p:SixLaborsLicenseFile=<sixlabors.lic> --filter "FullyQualifiedName~Issue316"
      cwd: .
      note: "Issue #316 regression (anonymous /ping JSON liveness contract): the documented [AllowAnonymous] JSON liveness endpoint GET /ping was shadowed to the SPA shell because UiAuthenticationMiddleware classified /ping as a UI-shell GET (its exclusion list only covered /api/, /login, /content/). Under AuthenticationRequired=Enabled the Forms challenge's LoginPath falls through to the SPA catch-all, so anonymous GET /ping returned 200 + index.html instead of the PingController's JSON {\"Status\":\"OK\"}. Fix: exclude the EXACT path /ping from the UiAuthenticationMiddleware UI-shell classification (string.Equals(path, \"/ping\")) so the [AllowAnonymous] PingController response is served directly; the #313/#315 auth-gate behavior (unauth UI 401, unauth API 401, authed API 200) is preserved for real UI-shell paths. Pinned by UiAuthenticationMiddlewareIssue316Fixture (5 tests: anonymous /ping passes through unchallenged — RED at base; disabled-mode /ping passes through; authed /ping passes through; UI-shell paths still challenge with Forms; /ping/extra is not exempted) plus PingControllerIssue316Fixture (3 tests: 200 + Status=OK JSON contract; 500 + Status=Error when config repo unavailable; route attributes declare [AllowAnonymous] + [HttpGet/HttpHead \"/ping\"]) plus ProbeFixture (1 sanity test). RE-VERIFIED 2026-10-21 at develop f5857ee953 (base) with work branch fix/issue-316-ping-anonymous-json-shadowed-by-spa-shell (run t_897492ef): RED 1-failed/7-passed at base (the critical middleware test) / GREEN 8/8 post-fix; full NzbDrone.Api.Test suite 117/117; full solution Release build 0 warn/0 err. The durable end-to-end HTTP acceptance (anonymous /ping = 200 JSON over the wire) is exercised in the application-test stage; this unit-level fixture is the CI-parity guard."
