  #     through unchallenged (RED at base); disabled-mode /ping passes through;
  #     authed /ping passes through; UI-shell paths still challenge with Forms;
  #     /ping/extra is not exempted (exact-path-only exclusion).
  #   - PingControllerIssue316Fixture (3 tests): 200 + Status=OK JSON contract;
  #     500 + Status=Error when config repo unavailable; route attributes declare
  #     [AllowAnonymous] + [HttpGet/HttpHead "/ping"].
  #   - ProbeFixture (1 test): sanity probe.
  # Verified at the fixed head: issue-316 8/8 (RED 1-fail at base for the critical
  # middleware test), full NzbDrone.Api.Test suite 117/117, full solution Release
  # build 0 warn/0 err. PRE-EXISTING: 108 deterministic Core-suite failures in the
  # isolated env (unchanged; CI runs targeted filters only).
  # Hosted exact-head CI is the merge gate. Prior verified runs remain the record:
  # issue #309 @ 9013f8fd (t_00c99e08), issue #307 @ 9013f8fd (t_d604af7f), issue #296
  # @ 816bd8d3e8 (t_56e08eff), issue #272 @ 42d0de9e (t_60662025), issue #275 repair
  # (t_7bdf990f), issue #279 @ 8d2281e4c5 (t_f1ae9028), issue #256 @ 75c21186
  # (t_5daa7896), PR #243 @ 949a43a160 (t_e4ea7a87), PR #225 @ 1f37119280
  # (t_efb34b16), 2026-09-18 baseline @ d21d1361c. Issue #323 CI-repair assessment
  # (t_bdadaf92, 2026-10-22) at develop dd09a97c80 re-verified the full failing-lane
  # surface GREEN with zero NU19xx audit diagnostics; see its baseline entry and
  # logs-t_bdadaf92/.
  lane: develop (net10.0 band)
  note: >
    Issue #340 development run (t_61914698, run 3111, 2026-10-29, base
    develop 5f21b32cd147, work branch
    fix/issue-340-manualimport-null-safety-no-provider, head 8407bb9079).
    POST /api/v1/manualimport (update path) accepted a payload with an
    approved, seeded book fixture (202) but created no BookFile row: with
    NO metadata provider configured (a legal state),
    MetadataProviderOrchestrator.SearchForNewBook returned null and
    CandidateService.SearchPrimary invoked results.Any() on it, throwing
    an unhandled ArgumentNullException (Parameter 'source') that escaped
    GetRemoteCandidates, left release.Edition == null, and
    ImportApprovedBooks imported 0 files. The #275 fallback in
    ImportDecisionMaker.IdentifyReleaseFallback had the same null hazard
    (books.Where on null). Fix: null-coalesce the orchestrator result to
    an empty List<Book> at all call sites feeding ToCandidates
    (SearchPrimary, four GetRemoteCandidates paths, ISBN contextual
    fallback) and null-guard books before .Where in
    IdentifyReleaseFallback. RED: CandidateServiceIssue340Fixture 4/4
    FAILED at base; GREEN: 4/4 + ImportDecisionMakerIssue275Fixture 6/6
    (incl. new #340-complement test); targeted CI filters 31/31 PASSED;
    full solution Release build 0 warn/0 err (SixLabors license
    provisioned; value never logged/committed). No JS/TS runtime files
    under src/frontend/lib/app changed (no production_coverage binding
    required). Closes #340.
    Issue #323 CI-repair assessment run (t_bdadaf92, 2026-10-22). At exact develop
    head dd09a97c80 (PR #318 merge), 4/14 hosted check-runs were failing
    (build-test, cross-build Linux/Windows/macOS) while parent f5857ee953 was 14/14.
    The in-container re-execution of every failing POSIX step at the exact head is
    GREEN: restore exit 0 (default live NuGetAudit and explicit -p:NuGetAudit=true),
    full Release build 0 warn/0 err, Common.Test --no-build 621 passed/35 skipped/0
    failed, check_http_binding.sh exit 0, direct Windows-desktop project restore +
    model build 0/0, RID Architecture property x64, rid_mapping source-assertion
    gate 4/4 — with zero NU19xx audit diagnostics. The failing lane surface is
    disjoint from the PR #318 diff (.onyx/project.yaml + UiAuthenticationMiddleware.cs
    + 3 Api.Test fixtures); no failing CI step touches those artifacts. Root cause:
    the .NET SDK NuGetAudit runs during restore against the LIVE advisory endpoint
    and the advisory database is time-of-run dependent, so a package can gain a new
    advisory between runs and (with TreatWarningsAsErrors) escalate NU19xx to hard
    restore errors — a non-deterministic environment-timing failure class, not a
    deterministic product-code regression from the merged PR. No product-code change
    required; this run documents the evidence and re-verifies the contract. Hosted
    exact-head CI is the merge gate. PRE-EXISTING: 108 deterministic Core-suite
    failures in the isolated env (unchanged; CI runs targeted filters only).
    Prior run record (issue #316 development run, t_897492ef, 2026-10-21, base
    f5857ee953): the documented [AllowAnonymous] JSON liveness endpoint GET /ping was
    shadowed to the SPA shell because UiAuthenticationMiddleware (src/Bibliophilarr.Http/Middleware/UiAuthenticationMiddleware.cs)
    classified /ping as a UI-shell GET — its exclusion list only covered /api/,
    /login, and /content/. Under AuthenticationRequired=Enabled, the Forms
    challenge's LoginPath falls through to the SPA catch-all
    (StaticResourceController.Index), so every anonymous /ping request returned 200 +
    7666-byte HTML instead of the PingController's JSON {"Status":"OK"}. The fix
    excludes the EXACT path /ping from the UI-shell classification
    (string.Equals(path, "/ping")) so the [AllowAnonymous] PingController response is
    served directly; the exclusion is path-exact only (/ping/extra is still governed
    as a UI shell) and the #313/#315 auth-gate behavior (unauth UI 401, unauth API
    401, authed API 200) is preserved unchanged. Three regression test fixtures
    (8 tests) added. Verified at the fixed head: issue-316 8/8 (RED 1-fail at base),
    full NzbDrone.Api.Test 117/117, full solution Release build 0 warn/0 err.
    Hosted exact-head CI is the merge gate.

